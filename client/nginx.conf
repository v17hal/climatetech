server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vite is built with base=/carbonsmart/, so index.html references
    # /carbonsmart/assets/*. Files live under html/carbonsmart/ to match,
    # letting the outer reverse proxy forward the prefix verbatim.
    location /carbonsmart/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /carbonsmart/ {
        try_files $uri $uri/ /carbonsmart/index.html;
    }

    location = / {
        return 200 'CarbonSmart frontend — app at /carbonsmart/\n';
        add_header Content-Type text/plain;
    }
}
